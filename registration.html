<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="registration">

        <div class="form-container">

            <h2>Conference Registration</h2>

            <form>

                <input type="text"
                       placeholder="Full Name"
                       required>

                <input type="email"
                       placeholder="Email Address"
                       required>

                <input type="text"
                       placeholder="Institution / Organization"
                       required>

                <input type="text"
                       placeholder="Country"
                       required>

                <input type="tel"
                       placeholder="Phone Number"
                       required>

                <select required>
                    <option value="">
                        Select Category
                    </option>

                    <option>
                        Student
                    </option>

                    <option>
                        Research Scholar
                    </option>

                    <option>
                        Faculty
                    </option>

                    <option>
                        Industry Professional
                    </option>
                </select>

                <button type="submit"
                        class="btn">
                    Register
                </button>

            </form>

        </div>

    </section>

</body>

</html>
